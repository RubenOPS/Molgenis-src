---
# ===================================
# Base packages
# ===================================
- name: 📦 Install base packages (Ubuntu)
  ansible.builtin.apt:
    pkg:
      - openjdk-21-jre
      - python3-psycopg2
      - nginx
      - net-tools
      - docker.io
    update_cache: yes
  when: ansible_facts['distribution'] == "Ubuntu"

- name: 📦 Install base packages (RedHat)
  ansible.builtin.dnf:
    name:
      - java-21-openjdk-headless
      - python3-psycopg2
      - nginx
      - net-tools
      - docker-ce
      - docker-ce-cli
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: ✅ Enable and start Docker (RedHat)
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started
  when: ansible_facts['os_family'] == "RedHat"

# ===================================
# PostgreSQL 15 repo + install
# ===================================
- name: 🔑 Add postgres repo key (Ubuntu)
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/trusted.gpg.d/postgres.asc
    mode: '0644'
  when: ansible_facts['distribution'] == "Ubuntu"

- name: ⚙️ Setup postgresql repo (Ubuntu 22)
  ansible.builtin.copy:
    content: |
      deb [signed-by=/etc/apt/trusted.gpg.d/postgres.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main
    dest: /etc/apt/sources.list.d/pgdg.list
    mode: '0644'
    owner: root
    group: root
  when: ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == '22'

- name: ⚙️ Setup postgresql repo (Ubuntu 24)
  ansible.builtin.copy:
    content: |
      deb [signed-by=/etc/apt/trusted.gpg.d/postgres.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main
    dest: /etc/apt/sources.list.d/pgdg.list
    mode: '0644'
    owner: root
    group: root
  when: ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == '24'

- name: 📦 Install postgresql-15 (Ubuntu)
  ansible.builtin.apt:
    pkg:
      - postgresql-15
      - postgresql-client-15
    update_cache: yes
  when: ansible_facts['distribution'] == "Ubuntu"

- name: 🔑 Add postgres repo (RedHat)
  ansible.builtin.dnf:
    name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_facts['distribution_major_version'] }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
    disable_gpg_check: yes
  when: ansible_facts['os_family'] == "RedHat"

- name: ⚙️ Disable built-in postgresql module (RedHat)
  ansible.builtin.command: dnf -qy module disable postgresql
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: 📦 Install postgresql-15 (RedHat)
  ansible.builtin.dnf:
    name:
      - postgresql15-server
      - postgresql15
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: 🔎 Check if postgresql-15 data directory is initialized (RedHat)
  ansible.builtin.stat:
    path: /var/lib/pgsql/15/data/PG_VERSION
  register: pg_initialized
  when: ansible_facts['os_family'] == "RedHat"

- name: ⚙️ Initialize postgresql-15 database (RedHat)
  ansible.builtin.command: /usr/pgsql-15/bin/postgresql-15-setup initdb
  when: ansible_facts['os_family'] == "RedHat" and not pg_initialized.stat.exists

- name: ✅ Enable and start postgresql-15 (RedHat)
  ansible.builtin.systemd:
    name: postgresql-15
    enabled: yes
    state: started
  when: ansible_facts['os_family'] == "RedHat"

# ===================================
# PostgreSQL config
# ===================================
- name: ⚙️ Set postgresql.conf path
  ansible.builtin.set_fact:
    pg_conf_path: "{{ '/etc/postgresql/15/main/postgresql.conf' if ansible_facts['distribution'] == 'Ubuntu' else '/var/lib/pgsql/15/data/postgresql.conf' }}"

- name: 📋 Ensure max_locks_per_transaction is set to 256
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_path }}"
    regexp: "^#?max_locks_per_transaction\\s*="
    line: "max_locks_per_transaction = 256"
    state: present

# ===================================
# Timezone
# ===================================
- name: 🕐 Set timezone to Europe/Amsterdam
  community.general.timezone:
    name: Europe/Amsterdam

# ===================================
# Molgenis user, group and folder structure
# ===================================
- name: 🔒 Create sudoers file
  ansible.builtin.copy:
    src: molgenis
    dest: /etc/sudoers.d/molgenis
    mode: '0640'

- name: 📁 Create molgenis folder structure
  ansible.builtin.file:
    state: directory
    owner: molgenis
    group: molgenis
    mode: '0755'
    path: "{{ item }}"
  loop:
    - /usr/local/share/molgenis/
    - /usr/local/share/molgenis/war/
    - /usr/local/share/molgenis/tools/
    - /var/log/molgenis/

# ===================================
# EMX2 jar install
# ===================================
- name: ⬇️ Install jar MOLGENIS EMX2
  ansible.builtin.get_url:
    url: https://github.com/molgenis/molgenis-emx2/releases/download/v{{ emx2.version }}/molgenis-emx2-{{ emx2.version }}-all.jar
    mode: '0660'
    owner: molgenis
    group: molgenis
    dest: /usr/local/share/molgenis/war/

- name: 🔗 Create symlink to jar
  ansible.builtin.file:
    src: /usr/local/share/molgenis/war/molgenis-emx2-{{ emx2.version }}-all.jar
    dest: /usr/local/share/molgenis/molgenis.jar
    owner: molgenis
    group: molgenis
    state: link

- name: 🔎 Check if molgenis-server.properties exists
  ansible.builtin.stat:
    path: /usr/local/share/molgenis/molgenis-server.properties
  register: existing_properties

- name: ⚙️ Install new molgenis-server.properties
  ansible.builtin.copy:
    src: molgenis-server.properties
    dest: /usr/local/share/molgenis/molgenis-server.properties
    owner: molgenis
    group: molgenis
    mode: '0644'
  when: existing_properties.stat.isreg is not defined

- name: 🔎 Check if Docker is installed
  ansible.builtin.command: which docker
  register: docker_check
  ignore_errors: yes

- name: 🐳 Add molgenis user to docker group
  ansible.builtin.user:
    name: molgenis
    groups: docker
    append: yes
  when: docker_check.rc == 0

# ===================================
# Operational scripts
# ===================================
- name: 🚀 Copy operational scripts to shared directory
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ shared_dir }}/{{ item.dest }}"
    owner: root
    group: ops
    mode: "{{ item.mode }}"
  loop:
    - {src: "full_emx2_restore.sh", dest: "full_emx2_restore.sh", mode: "0750"}
    - {src: "emx2_wipe.sh", dest: "emx2_wipe.sh", mode: "0750"}

- name: 🚀 Install tool scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/share/molgenis/tools/"
    mode: 0700
    owner: root
    group: root
  loop:
    - emx2_clean_database.sh
    - emx2_clean_db_plus_restart.sh

- name: 🔗 Link tool scripts to /usr/bin
  ansible.builtin.file:
    src: "/usr/local/share/molgenis/tools/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    state: link
  loop:
    - emx2_clean_database.sh
    - emx2_clean_db_plus_restart.sh

# ===================================
# PostgreSQL molgenis user + db
# ===================================
- name: ⚙️ Set postgresql service name
  ansible.builtin.set_fact:
    pg_service_name: "{{ 'postgresql' if ansible_facts['distribution'] == 'Ubuntu' else 'postgresql-15' }}"

- name: 👤 Create 'molgenis' PostgreSQL user
  become: true
  become_user: postgres
  become_flags: -i
  no_log: true
  community.postgresql.postgresql_user:
    name: molgenis
    password: molgenis
    encrypted: true
    role_attr_flags: SUPERUSER

- name: 🗄️ Create 'molgenis' database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: molgenis
    owner: molgenis
    encoding: UTF8
    lc_collate: 'C.UTF-8'
    lc_ctype: 'C.UTF-8'
    template: template0
  register: new_db

- name: 🗄️ Create 'molgenis' schema
  become: true
  become_user: postgres
  ansible.builtin.command: psql -c 'CREATE SCHEMA IF NOT EXISTS molgenis;'  # noqa no-handler
  when: new_db is changed

- name: 🗄️ Grant rights to 'molgenis' user on schema
  become: true
  become_user: postgres
  ansible.builtin.command: psql -c 'GRANT ALL PRIVILEGES ON SCHEMA molgenis TO molgenis;'  # noqa no-handler
  when: new_db is changed

# ===================================
# Nginx setup
# ===================================
- name: ⚙️ Customize nginx.conf
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: "restart nginx"

- name: 📁 Create nginx default.d folder
  ansible.builtin.file:
    state: directory
    owner: root
    group: root
    mode: '0755'
    path: "/etc/nginx/default.d"

- name: ⚙️ Install emx2 nginx frontend config
  ansible.builtin.template:
    src: "{{ 'emx2-catalogue.j2' if enable_catalogue | default(false) | bool else 'emx2.j2' }}"
    dest: /etc/nginx/default.d/emx2.conf
    mode: '0644'
  notify: "restart nginx"

- name: ⚙️ Install SSR run script
  ansible.builtin.template:
    src: run-ssr.sh.j2
    dest: /home/molgenis/run-ssr.sh
    mode: '0755'
  when: enable_catalogue | default(false) | bool

- name: ✅ Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: started

# ===================================
# EMX2 service
# ===================================
- name: ⚙️ Add emx2.service file
  ansible.builtin.template:
    src: emx2_service.j2
    owner: root
    group: root
    dest: /etc/systemd/system/emx2.service
    mode: '0644'

- name: 📁 Create emx2.service.d folder
  ansible.builtin.file:
    path: /etc/systemd/system/emx2.service.d
    owner: root
    group: root
    mode: '0755'
    state: directory

- name: ⚙️ Add override.conf file
  ansible.builtin.template:
    src: override.j2
    owner: root
    group: root
    dest: /etc/systemd/system/emx2.service.d/override.conf
    mode: '0644'
  notify: "restart emx2"

- name: 🔗 Create symbolic link to full_restore script
  ansible.builtin.file:
    src: "{{ shared_dir }}/full_emx2_restore.sh"
    dest: /root/full_emx2_restore.sh
    owner: root
    group: root
    state: link
    force: yes

- name: ✅ Enable emx2 service
  ansible.builtin.systemd:
    name: emx2.service
    enabled: true
    daemon_reload: yes
    state: started

- name: ⏰ Add local EMX2 backup cronjob
  ansible.builtin.copy:
    src: molgenis-pgsql-dump
    dest: /etc/cron.daily/
    mode: 0755

# ===================================
# Python venv
# ===================================
- name: 📦 Install Python venv (Ubuntu)
  ansible.builtin.apt:
    pkg:
      - "{{ 'python3.12' if ansible_facts['distribution_major_version'] == '24' else 'python3.10' }}"
      - "{{ 'python3.12-venv' if ansible_facts['distribution_major_version'] == '24' else 'python3.10-venv' }}"
    update_cache: yes
  when: ansible_facts['distribution'] == "Ubuntu"

- name: 📦 Install Python venv (RedHat)
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_facts['os_family'] == "RedHat"

# ===================================
# APT hooks (Ubuntu only)
# ===================================
- name: ⚙️ Add apt hook
  ansible.builtin.copy:
    src: roles/emx2_ubuntu/files/99-restart-java-app
    dest: /etc/apt/apt.conf.d/
    mode: 0755
  when: ansible_facts['distribution'] == "Ubuntu"

- name: ⚙️ Add apt hook script
  ansible.builtin.copy:
    src: roles/emx2_ubuntu/files/restart-java-app.sh
    dest: /usr/local/bin/
    mode: 0755
  when: ansible_facts['distribution'] == "Ubuntu"

# ===================================
# Prometheus exporters
# ===================================
- name: 🔎 Check for existing nginx exporter install
  ansible.builtin.stat:
    path: /usr/bin/prometheus-nginx-exporter
  register: node_nginx_exporter_installed

- name: 📦 Install nginx prometheus exporter (Ubuntu)
  ansible.builtin.apt:
    name: prometheus-nginx-exporter
    state: present
  when: ansible_facts['distribution'] == "Ubuntu" and not node_nginx_exporter_installed.stat.exists

- name: 📦 Install nginx prometheus exporter (RedHat)
  ansible.builtin.dnf:
    name: prometheus-nginx-exporter
    state: present
  when: ansible_facts['os_family'] == "RedHat" and not node_nginx_exporter_installed.stat.exists

- name: 🔎 Check for existing postgres exporter install
  ansible.builtin.stat:
    path: /usr/bin/prometheus-postgres-exporter
  register: node_postgres_exporter_installed

- name: 📦 Install pgsql prometheus exporter (Ubuntu)
  ansible.builtin.apt:
    name: prometheus-postgres-exporter
    state: present
  when: ansible_facts['distribution'] == "Ubuntu" and not node_postgres_exporter_installed.stat.exists

- name: 📦 Install pgsql prometheus exporter (RedHat)
  ansible.builtin.dnf:
    name: prometheus-postgres-exporter
    state: present
  when: ansible_facts['os_family'] == "RedHat" and not node_postgres_exporter_installed.stat.exists

- name: ⚙️ Enable nginx stub statistics
  ansible.builtin.copy:
    src: roles/preinstall/files/nginx-stub-stats.conf
    dest: /etc/nginx/default.d/nginx-stub-stats.conf
    owner: root
    group: root
    mode: '0644'
  notify: "restart nginx"

- name: ⚙️ Copy prometheus nginx exporter config
  ansible.builtin.copy:
    src: roles/preinstall/files/prometheus-nginx-exporter
    dest: /etc/default/prometheus-nginx-exporter
    owner: root
    group: root
    mode: '0640'

- name: ⚙️ Copy prometheus pgsql exporter config
  ansible.builtin.copy:
    src: roles/preinstall/files/prometheus-postgres-exporter
    dest: /etc/default/prometheus-postgres-exporter
    owner: root
    group: root
    mode: '0640'

- name: ✅ Enable and start prometheus pgsql exporter
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    enabled: yes
    state: restarted

- name: ✅ Enable and start prometheus nginx exporter
  ansible.builtin.systemd:
    name: prometheus-nginx-exporter
    enabled: yes
    state: restarted

- name: 🔁 Restart PostgreSQL
  ansible.builtin.service:
    name: "{{ pg_service_name }}"
    state: restarted

# ===================================
# SSR Catalogue container
# ===================================
- name: 🐳 Start SSR catalogue container
  ansible.builtin.command: >
    docker run -d
    --name catalogue
    --restart unless-stopped
    --network host
    -e NUXT_PUBLIC_API_BASE=https://{{ domain_name }}/
    -e NUXT_PUBLIC_EMX2_THEME=molgenis
    -e NUXT_PUBLIC_SCHEMA=catalogue
    molgenis/ssr-catalogue:{{ emx2.version }}
  when: enable_catalogue | default(false) | bool
  register: catalogue_run
  changed_when: "'Started' in catalogue_run.stdout or catalogue_run.rc == 0"
