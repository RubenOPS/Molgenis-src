---
# ===================================
# Base packages
# ===================================
- name: 📦 Install base packages (Ubuntu)
  ansible.builtin.apt:
    pkg:
      - openjdk-21-jre
      - python3-psycopg2
    update_cache: true
  when: ansible_facts['distribution'] == "Ubuntu"

# ===================================
# PostgreSQL 15 repo + install
# ===================================
- name: 🔑 Add postgres repo key (Ubuntu)
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/trusted.gpg.d/postgres.asc
    mode: '0644'
  when: ansible_facts['distribution'] == "Ubuntu"

- name: ⚙️ Setup postgresql repo (Ubuntu 22)
  ansible.builtin.copy:
    content: |
      deb [signed-by=/etc/apt/trusted.gpg.d/postgres.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main
    dest: /etc/apt/sources.list.d/pgdg.list
    mode: '0644'
    owner: root
    group: root
  when: ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == '22'

- name: ⚙️ Setup postgresql repo (Ubuntu 24)
  ansible.builtin.copy:
    content: |
      deb [signed-by=/etc/apt/trusted.gpg.d/postgres.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main
    dest: /etc/apt/sources.list.d/pgdg.list
    mode: '0644'
    owner: root
    group: root
  when: ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == '24'

- name: 📦 Install postgresql-15 (Ubuntu)
  ansible.builtin.apt:
    pkg:
      - postgresql-15
      - postgresql-client-15
    update_cache: true
  when: ansible_facts['distribution'] == "Ubuntu"

- name: ⚙️ Disable built-in postgresql module (RedHat)
  ansible.builtin.command: dnf -qy module disable postgresql
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

# ===================================
# PostgreSQL config
# ===================================
- name: ⚙️ Set postgresql.conf path
  ansible.builtin.set_fact:
    pg_conf_path: "{{ '/etc/postgresql/15/main/postgresql.conf' if ansible_facts['distribution'] == 'Ubuntu' else '/var/lib/pgsql/15/data/postgresql.conf' }}"

- name: 📋 Ensure max_locks_per_transaction is set to 256
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_path }}"
    regexp: "^#?max_locks_per_transaction\\s*="
    line: "max_locks_per_transaction = 256"
    state: present

# ===================================
# Molgenis user, group and folder structure
# ===================================
- name: 🔒 Create sudoers file
  ansible.builtin.copy:
    src: molgenis
    dest: /etc/sudoers.d/molgenis
    mode: '0640'

- name: 📁 Create molgenis folder structure
  ansible.builtin.file:
    state: directory
    owner: molgenis
    group: molgenis
    mode: '0755'
    path: "{{ item }}"
  loop:
    - /usr/local/share/molgenis/
    - /usr/local/share/molgenis/war/
    - /usr/local/share/molgenis/tools/
    - /var/log/molgenis/

# ===================================
# EMX2 jar install
# ===================================
- name: ⬇️ Install jar MOLGENIS EMX2
  ansible.builtin.get_url:
    url: https://github.com/molgenis/molgenis-emx2/releases/download/v{{ emx2.version }}/molgenis-emx2-{{ emx2.version }}-all.jar
    mode: '0660'
    owner: molgenis
    group: molgenis
    dest: /usr/local/share/molgenis/war/

- name: 🔗 Create symlink to jar
  ansible.builtin.file:
    src: /usr/local/share/molgenis/war/molgenis-emx2-{{ emx2.version }}-all.jar
    dest: /usr/local/share/molgenis/molgenis.jar
    owner: molgenis
    group: molgenis
    state: link

- name: 🔎 Check if molgenis-server.properties exists
  ansible.builtin.stat:
    path: /usr/local/share/molgenis/molgenis-server.properties
  register: existing_properties

- name: ⚙️ Install new molgenis-server.properties
  ansible.builtin.copy:
    src: molgenis-server.properties
    dest: /usr/local/share/molgenis/molgenis-server.properties
    owner: molgenis
    group: molgenis
    mode: '0644'
  when: existing_properties.stat.isreg is not defined

# ===================================
# Operational scripts
# ===================================
- name: 🚀 Copy operational scripts to shared directory
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ shared_dir }}/{{ item.dest }}"
    owner: root
    group: ops
    mode: "{{ item.mode }}"
  loop:
    - {src: "full_emx2_restore.sh", dest: "full_emx2_restore.sh", mode: "0750"}
    - {src: "emx2_wipe.sh", dest: "emx2_wipe.sh", mode: "0750"}

- name: 🚀 Install tool scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/share/molgenis/tools/"
    mode: '0700'
    owner: root
    group: root
  loop:
    - emx2_clean_database.sh
    - emx2_clean_db_plus_restart.sh

- name: 🔗 Link tool scripts to /usr/bin
  ansible.builtin.file:
    src: "/usr/local/share/molgenis/tools/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    state: link
  loop:
    - emx2_clean_database.sh
    - emx2_clean_db_plus_restart.sh

# ===================================
# PostgreSQL molgenis user + db
# ===================================
- name: ⚙️ Set postgresql service name
  ansible.builtin.set_fact:
    pg_service_name: "{{ 'postgresql' if ansible_facts['distribution'] == 'Ubuntu' else 'postgresql-15' }}"

- name: 👤 Create 'molgenis' PostgreSQL user
  become: true
  become_user: postgres
  become_flags: -i
  no_log: true
  community.postgresql.postgresql_user:
    name: molgenis
    password: molgenis
    encrypted: true
    role_attr_flags: SUPERUSER

- name: 🗄️ Create 'molgenis' database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: molgenis
    owner: molgenis
    encoding: UTF8
    lc_collate: 'C.UTF-8'
    lc_ctype: 'C.UTF-8'
    template: template0
  register: new_db

- name: 🗄️ Create molgenis schema
  become: true
  become_user: postgres
  ansible.builtin.command: psql -c 'CREATE SCHEMA IF NOT EXISTS molgenis;'  # noqa no-handler
  when: new_db is changed

- name: 🗄️ Grant rights to molgenis user on schema
  become: true
  become_user: postgres
  ansible.builtin.command: psql -c 'GRANT ALL PRIVILEGES ON SCHEMA molgenis TO molgenis;'  # noqa no-handler
  when: new_db is changed

# ===================================
# Nginx setup
# ===================================
- name: ⚙️ Customize nginx.conf
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: "restart nginx"

- name: 📁 Create nginx default.d folder
  ansible.builtin.file:
    state: directory
    owner: root
    group: root
    mode: '0755'
    path: "/etc/nginx/default.d"

- name: ⚙️ Install emx2 nginx frontend config
  ansible.builtin.template:
    src: "{{ 'emx2-catalogue.j2' if enable_catalogue | default(false) | bool else 'emx2.j2' }}"
    dest: /etc/nginx/default.d/emx2.conf
    mode: '0644'
  notify: "restart nginx"

- name: ✅ Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

# ===================================
# EMX2 service
# ===================================
- name: ⚙️ Add emx2.service file
  ansible.builtin.template:
    src: emx2_service.j2
    owner: root
    group: root
    dest: /etc/systemd/system/emx2.service
    mode: '0644'

- name: 📁 Create emx2.service.d folder
  ansible.builtin.file:
    path: /etc/systemd/system/emx2.service.d
    owner: root
    group: root
    mode: '0755'
    state: directory

- name: ⚙️ Add override.conf file
  ansible.builtin.template:
    src: override.j2
    owner: root
    group: root
    dest: /etc/systemd/system/emx2.service.d/override.conf
    mode: '0644'
  notify: "restart emx2"

- name: 🔗 Create symbolic link to full_restore script
  ansible.builtin.file:
    src: "{{ shared_dir }}/full_emx2_restore.sh"
    dest: /root/full_emx2_restore.sh
    owner: root
    group: root
    state: link
    force: true

- name: ✅ Enable emx2 service
  ansible.builtin.systemd:
    name: emx2.service
    enabled: true
    daemon_reload: true
    state: started

# ===================================
# Python venv
# ===================================
- name: 📦 Install Python venv (Ubuntu)
  ansible.builtin.apt:
    pkg:
      - "{{ 'python3.12' if ansible_facts['distribution_major_version'] == '24' else 'python3.10' }}"
      - "{{ 'python3.12-venv' if ansible_facts['distribution_major_version'] == '24' else 'python3.10-venv' }}"
    update_cache: true
  when: ansible_facts['distribution'] == "Ubuntu"

- name: 📦 Install Python venv (RedHat)
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_facts['os_family'] == "RedHat"

# ===================================
# APT hooks (Ubuntu only)
# ===================================
- name: ⚙️ Add apt hook
  ansible.builtin.copy:
    src: roles/emx2_ubuntu/files/99-restart-java-app
    dest: /etc/apt/apt.conf.d/
    mode: '0755'
  when: ansible_facts['distribution'] == "Ubuntu"

- name: ⚙️ Add apt hook script
  ansible.builtin.copy:
    src: roles/emx2_ubuntu/files/restart-java-app.sh
    dest: /usr/local/bin/
    mode: '0755'
  when: ansible_facts['distribution'] == "Ubuntu"
