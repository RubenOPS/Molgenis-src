---
- name: Deploy MOLGENIS EMX2 on SURF Research Cloud
  hosts: all
  gather_facts: true
  become: true
  vars:
    domain_name: "{{ ansible_facts['fqdn'] }}"
    shared_dir: /srv/molgenis-work
    emx2:
      adminPassword: "{{ emx2_admin_password | default('') }}"  # secret SRC parameter
      setup: true
      version: "{{ emx2_version }}"                              # SRC parameter
      ssh: false
      memory:
        xms: 256m
        xmx: 1024m

  pre_tasks:
    # Prints variable NAMES only (no values), so it is safe to leave in the log
    - name: Show which parameters SRC passed
      ansible.builtin.debug:
        msg: "{{ vars.keys() | select('search', '(?i)emx2|oidc|password') | list }}"

    - name: Fail if required parameters are missing
      ansible.builtin.assert:
        that:
          - emx2_admin_password is defined
          - emx2_admin_password | length > 0
          - emx2_version is defined
          - emx2_version | length > 0
        fail_msg: >-
          emx2_admin_password and/or emx2_version were not passed in by SRC.
          Check that the Emx2 component is attached to the catalog item
          and that the parameters appear there.

  roles:
    - emx2_ubuntu
